services:
  postgres:
    image: postgres:16-alpine
    container_name: wishlist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -t 2']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - wishlist_postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: wishlist-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  wishlist_postgres_data:
